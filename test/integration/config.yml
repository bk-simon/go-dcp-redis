hosts:
  - localhost:8091
username: user
password: 123456
bucketName: dcp-test
rollbackMitigation:
  disabled: true
checkpoint:
  type: manual
dcp:
  group:
    name: groupName
metadata:
  type: couchbase
  readOnly: true
  config:
    bucket: dcp-test

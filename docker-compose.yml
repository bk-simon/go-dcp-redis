version: "3.8"
services:
  couchbase:
    build:
      context: "test/couchbase"
    ports:
      - "8091:8091"
      - "11210:11210"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://user:123456@localhost:8091/pools/default/buckets/dcp-test",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  redis-master:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --port 6379
    volumes:
      - redis_master_data:/data

  redis-sentinel-1:
    image: redis:8-alpine
    ports:
      - "26379:26379"
    command: >
      sh -c "
      sleep 5 &&
      REDIS_MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
      echo \"port 26379\" > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$REDIS_MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
      echo \"sentinel down-after-milliseconds mymaster 5000\" >> /tmp/sentinel.conf &&
      echo \"sentinel failover-timeout mymaster 10000\" >> /tmp/sentinel.conf &&
      echo \"sentinel parallel-syncs mymaster 1\" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      "
    depends_on:
      - redis-master

  redis-sentinel-2:
    image: redis:8-alpine
    ports:
      - "26380:26379"
    command: >
      sh -c "
      sleep 5 &&
      REDIS_MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
      echo \"port 26379\" > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$REDIS_MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
      echo \"sentinel down-after-milliseconds mymaster 5000\" >> /tmp/sentinel.conf &&
      echo \"sentinel failover-timeout mymaster 10000\" >> /tmp/sentinel.conf &&
      echo \"sentinel parallel-syncs mymaster 1\" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      "
    depends_on:
      - redis-master

  redis-sentinel-3:
    image: redis:8-alpine
    ports:
      - "26381:26379"
    command: >
      sh -c "
      sleep 5 &&
      REDIS_MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}') &&
      echo \"port 26379\" > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$REDIS_MASTER_IP 6379 2\" >> /tmp/sentinel.conf &&
      echo \"sentinel down-after-milliseconds mymaster 5000\" >> /tmp/sentinel.conf &&
      echo \"sentinel failover-timeout mymaster 10000\" >> /tmp/sentinel.conf &&
      echo \"sentinel parallel-syncs mymaster 1\" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      "
    depends_on:
      - redis-master

  # Redis Cluster nodes
  redis-cluster-1:
    image: redis:8-alpine
    ports:
      - "7000:7000"
    command: redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis_cluster_1:/data

  redis-cluster-2:
    image: redis:8-alpine
    ports:
      - "7001:7001"
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis_cluster_2:/data

  redis-cluster-3:
    image: redis:8-alpine
    ports:
      - "7002:7002"
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis_cluster_3:/data

  redis-cluster-4:
    image: redis:8-alpine
    ports:
      - "7003:7003"
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis_cluster_4:/data

  redis-cluster-5:
    image: redis:8-alpine
    ports:
      - "7004:7004"
    command: redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis_cluster_5:/data

  redis-cluster-6:
    image: redis:8-alpine
    ports:
      - "7005:7005"
    command: redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis_cluster_6:/data

  redis-cluster-init:
    image: redis:8-alpine
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
      - redis-cluster-6
    command: >
      sh -c "
      sleep 10 &&
      CLUSTER1_IP=$$(getent hosts redis-cluster-1 | awk '{print $$1}') &&
      CLUSTER2_IP=$$(getent hosts redis-cluster-2 | awk '{print $$1}') &&
      CLUSTER3_IP=$$(getent hosts redis-cluster-3 | awk '{print $$1}') &&
      CLUSTER4_IP=$$(getent hosts redis-cluster-4 | awk '{print $$1}') &&
      CLUSTER5_IP=$$(getent hosts redis-cluster-5 | awk '{print $$1}') &&
      CLUSTER6_IP=$$(getent hosts redis-cluster-6 | awk '{print $$1}') &&
      redis-cli --cluster create $$CLUSTER1_IP:7000 $$CLUSTER2_IP:7001 $$CLUSTER3_IP:7002 $$CLUSTER4_IP:7003 $$CLUSTER5_IP:7004 $$CLUSTER6_IP:7005 --cluster-replicas 1 --cluster-yes
      "
    restart: "no"

volumes:
  redis_data:
  redis_master_data:
  redis_cluster_1:
  redis_cluster_2:
  redis_cluster_3:
  redis_cluster_4:
  redis_cluster_5:
  redis_cluster_6:
